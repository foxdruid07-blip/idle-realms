<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Idle Realms — Tibia Style</title>
<style>
:root{
  --madeira-escura:#3A2915; --madeira-clara:#5C4428;
  --ouro-escuro:#B8860B; --ouro-brilhante:#FFD700; --bronze:#CD7F32;
  --comum:#C0C0C0; --incomum:#32CD32; --raro:#4169E1; --epico:#9932CC;
  --lendario:#FF8C00; --mitico:#FF1493; --divino:#FFD700; --ultra:#FFF8DC;
  --vida:#DC143C; --mana:#4169E1; --xp:#32CD32; --stamina:#20B2AA;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Georgia',serif}
body{background:linear-gradient(135deg,#1A1208,#2C2010);color:#E8D4A8;min-height:100vh}

.topo{background:linear-gradient(180deg,#3A2915,#2C1E0F);border-bottom:3px solid var(--ouro-escuro);padding:8px 15px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.logo{font-size:1.4rem;font-weight:bold;color:var(--ouro-brilhante);text-shadow:2px 2px 4px #000}
.status-topo{display:flex;gap:15px;align-items:center;font-size:.9rem}
.barra-topo{width:120px;height:14px;background:#1A1A1A;border:2px solid var(--bronze);border-radius:3px;overflow:hidden}
.barra-topo>div{height:100%;transition:.3s}
.stamina-bar{background:linear-gradient(90deg,#008080,#20B2AA)}
.ouro-topo{color:var(--ouro-brilhante);font-weight:bold}

.abas{display:flex;background:#2C1E0F;border-bottom:2px solid var(--bronze);padding:0 10px;flex-wrap:wrap}
.aba{padding:8px 14px;cursor:pointer;border:2px solid transparent;border-bottom:0;border-radius:6px 6px 0 0;color:#C8B896;font-size:.88rem}
.aba.ativa{background:linear-gradient(180deg,#5C4428,#3A2915);border-color:var(--ouro-escuro);color:var(--ouro-brilhante);margin-bottom:-2px;border-bottom:2px solid #3A2915}

.corpo{display:grid;grid-template-columns:240px 1fr 280px;gap:12px;padding:12px;max-width:1450px;margin:0 auto}
.coluna{background:linear-gradient(180deg,#3A2915,#2C1E0F);border:3px solid var(--ouro-escuro);border-radius:8px;padding:12px;box-shadow:inset 0 0 15px rgba(0,0,0,.5)}
.tit-coluna{font-size:.95rem;color:var(--ouro-brilhante);margin-bottom:10px;padding-bottom:5px;border-bottom:2px solid var(--madeira-clara)}

.avatar{text-align:center;font-size:64px;margin:8px 0;position:relative}
.aura{position:absolute;inset:-10px;border-radius:50%;opacity:.35;pointer-events:none;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.45}}
.linha-status{margin:6px 0;font-size:.85rem}
.barra{height:16px;background:#1A1A1A;border:2px solid var(--bronze);border-radius:3px;overflow:hidden;margin:3px 0}
.barra>div{height:100%;transition:.3s}
.vida-bar{background:linear-gradient(90deg,#8B0000,#DC143C)}
.mana-bar{background:linear-gradient(90deg,#00008B,#4169E1)}
.xp-bar{background:linear-gradient(90deg,#006400,#32CD32)}

.eq-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}
.eq-slot{aspect-ratio:1;background:#2C2010;border:2px solid #5C4428;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px;cursor:pointer;transition:.15s}
.eq-slot:hover{border-color:var(--ouro-brilhante);background:#3A2915}
.eq-nome{font-size:.6rem;color:#B8A888;margin-top:2px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}

.hunt-card{background:#2C2010;border:2px solid var(--bronze);border-radius:6px;padding:10px;margin-bottom:8px;cursor:pointer;transition:.15s}
.hunt-card:hover{border-color:var(--ouro-brilhante);background:#3A2915}
.hunt-card.bloq{opacity:.5;cursor:not-allowed}

.qtd-monstros{display:flex;gap:6px;margin:8px 0}
.btn-qtd{padding:4px 8px;background:#2C2010;border:2px solid #5C4428;border-radius:4px;color:#E8D4A8;cursor:pointer;font-size:.8rem}
.btn-qtd.ativa{border-color:var(--ouro-brilhante);background:#3A2915;color:var(--ouro-brilhante)}

.arena{height:200px;background:linear-gradient(180deg,#2A3A20,#1A2612);border:3px solid var(--bronze);border-radius:6px;position:relative;overflow:hidden;margin:10px 0}
.pc{position:absolute;left:15%;bottom:25px;font-size:56px;transition:.15s}
.pc.atacando{animation:balanca .25s}
@keyframes balanca{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-10deg)scale(1.08)}75%{transform:rotate(8deg)}}
.mon{position:absolute;right:15%;bottom:25px;font-size:56px;transition:.15s}
.mon.dano{animation:treme .15s;filter:brightness(1.5)}
@keyframes treme{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.mon.morto{opacity:0;transform:translateY(40px) rotate(90deg);transition:.4s}

.barra-mon{position:absolute;right:15%;bottom:70px;width:80px;height:10px;background:#1A1A1A;border:1px solid var(--bronze);border-radius:3px;overflow:hidden}
.barra-mon>div{height:100%;background:var(--vida);width:100%;transition:.25s}
.nome-mon{position:absolute;right:15%;bottom:85px;font-size:.8rem;color:#CCC}

.botoes{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.btn{padding:7px 14px;background:linear-gradient(180deg,#5C4428,#3A2915);color:#E8D4A8;border:2px solid var(--ouro-escuro);border-radius:5px;cursor:pointer;font-size:.85rem;font-weight:bold;transition:.15s}
.btn:hover{border-color:var(--ouro-brilhante);transform:translateY(-1px)}
.btn.secundario{background:linear-gradient(180deg,#3A3A3A,#2A2A2A);border-color:#555}
.btn.mini{padding:4px 8px;font-size:.78rem}

.log-area{height:80px;background:#1A1A1A;border:2px solid var(--bronze);border-radius:4px;padding:8px;overflow-y:auto;font-size:.78rem;line-height:1.4;margin-top:8px}
.log-area .dano{color:#FF6666}
.log-area .cura{color:#66FF66}
.log-area .ouro{color:#FFD700}
.log-area .destaque{color:#FFD700}

.inv-bloco{margin-top:12px;padding-top:10px;border-top:2px solid var(--madeira-clara)}
.inv-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:8px}
.inv-slot{aspect-ratio:1;background:#2C2010;border:2px solid #5C4428;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;transition:.15s}
.inv-slot:hover{transform:scale(1.1);z-index:5}
.r-comum{border-color:var(--comum)}
.r-incomum{border-color:var(--incomum)}
.r-raro{border-color:var(--raro)}
.r-epico{border-color:var(--epico)}
.r-lendario{border-color:var(--lendario)}
.r-mitico{border-color:var(--mitico)}

.venda-config{background:#2C2010;border:2px solid var(--bronze);border-radius:6px;padding:10px;margin-top:10px}
.linha-check{display:flex;align-items:center;gap:6px;margin:4px 0;font-size:.85rem}
input[type=checkbox]{accent-color:var(--ouro-brilhante);width:14px;height:14px;cursor:pointer}

.item-nome{font-size:1rem;font-weight:bold;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid #5C4428}
.atributo{font-size:.8rem;margin:3px 0;padding-left:8px}
.refino-area{margin-top:10px;padding-top:8px;border-top:2px solid #5C4428}
.refino-barra{height:10px;background:#1A1A1A;border-radius:3px;overflow:hidden;margin:4px 0}
.refino-barra>div{height:100%;background:linear-gradient(90deg,#B8860B,#FFD700)}

.analyzer{background:#2C2010;border:2px solid var(--bronze);border-radius:6px;padding:10px;margin:10px 0}
.analyzer-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:.82rem}
.valor-xp{color:var(--xp);font-weight:bold}
.valor-ouro{color:var(--ouro-brilhante);font-weight:bold}

.mineracao-area{text-align:center;padding:20px}
.minerando{font-size:48px;animation:balanca-min .8s infinite alternate;display:inline-block}
@keyframes balanca-min{0%{transform:rotate(-10deg)}100%{transform:rotate(10deg)}}

.pagina{display:none}
.pagina.mostra{display:block}
.area-batalha{display:none}
</style>
</head>
<body>

<div class="topo">
  <div class="logo">⚔️ Idle Realms — Tibia Style</div>
  <div class="status-topo">
    <div>
      <span>⚡ Stamina: <span id="stamina-txt">08:00</span></span>
      <div class="barra-topo"><div class="stamina-bar" id="stamina-bar"></div></div>
    </div>
    <div class="ouro-topo">💰 Ouro: <span id="ouro-topo">0</span></div>
    <div>⭐ Nv.<span id="lvl-topo">1</span></div>
  </div>
</div>

<div class="abas">
  <div class="aba ativa" onclick="mostrarAba('hunt')">🗺️ Caça</div>
  <div class="aba" onclick="mostrarAba('minerar')">⛏️ Minerar</div>
  <div class="aba" onclick="mostrarAba('craft')">🔨 Craftar</div>
  <div class="aba" onclick="mostrarAba('dungeon')">🏰 Masmorra</div>
  <div class="aba" onclick="mostrarAba('boss')">👹 Boss</div>
</div>

<div class="corpo">
  <div class="coluna">
    <div class="tit-coluna">🧑 Personagem</div>
    <div class="avatar" id="avatar">
      <div class="aura" id="aura-personagem"></div>🧙‍♂️
    </div>
    <div class="linha-status">❤️ Vida <span id="vida-txt">100/100</span><div class="barra"><div class="vida-bar" id="vida-bar"></div></div></div>
    <div class="linha-status">💧 Mana <span id="mana-txt">100/100</span><div class="barra"><div class="mana-bar" id="mana-bar"></div></div></div>
    <div class="linha-status">⭐ XP <span id="xp-txt">0/100</span><div class="barra"><div class="xp-bar" id="xp-bar"></div></div></div>
    <div style="margin-top:10px;font-size:.8rem">✨ Refino Total: <span id="refino-total">0</span></div>
    <div style="font-size:.78rem;color:#CCC;margin-top:4px">Aura: <span id="nome-aura">Nenhuma</span></div>
    <div class="eq-grid" id="equipamentos"></div>
  </div>
